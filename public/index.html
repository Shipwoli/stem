<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Matches your brand red instead of the CRA default black -->
    <meta name="theme-color" content="#e31e2c" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Stemtrix empowers the next generation through hands-on robotics, coding, and STEM education in Kenya. Robotics tournaments, coding classes, holiday camps, and more for ages 4-17."
    />
    <meta
      name="keywords"
      content="STEM education Kenya, robotics education Kenya, coding for kids, Scratch, Python, LEGO Spike, EV3 Mindstorms, WeDo 2.0, First Lego League, Inspire Robotics Challenge, robotics tournament, after school program, holiday robotics camp"
    />
    <meta name="author" content="Stemtrix" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical for the homepage itself; every inner page sets its own via Helmet -->
    <link rel="canonical" href="https://www.stemtrix.co.ke/" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:site_name" content="Stemtrix" />
    <meta property="og:title" content="Stemtrix - Empowering Young Minds with Robotics, Coding & STEM" />
    <meta
      property="og:description"
      content="Join Stemtrix to inspire creativity and innovation in the next generation through hands-on robotics, coding, and STEM education."
    />
    <!--
      IMPORTANT: this must be a full, absolute URL (not %PUBLIC_URL%) or social
      crawlers (WhatsApp, Facebook, LinkedIn, Twitter/X) can't resolve it.
      Ideal size is 1200x630px. Replace with your real hosted image URL.
    -->
    <meta property="og:image" content="https://www.stemtrix.co.ke/og-image.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.stemtrix.co.ke/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stemtrix - Empowering Young Minds with Robotics, Coding & STEM" />
    <meta
      name="twitter:description"
      content="Join Stemtrix to inspire creativity and innovation in the next generation through hands-on robotics, coding, and STEM education."
    />
    <meta name="twitter:image" content="https://www.stemtrix.co.ke/og-image.jpeg" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Stemtrix - Empowering Young Minds with Robotics, Coding & STEM</title>

    <!--
      Fonts: loaded once here instead of via @import in every page's CSS file
      (HomePage.css, Contact.css, Sign.css, Service.css, About.css, Program.css,
      Product.css all currently @import the same three font families — that's
      7 duplicate, render-blocking requests for identical fonts). Once this is
      live, remove the @import line from the top of each of those CSS files.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Bootstrap: loaded once here from the CDN. A few components (e.g. Sign.js)
      also do `import "bootstrap/dist/css/bootstrap.min.css"` directly — that
      double-loads the same stylesheet. Once you confirm this CDN link works
      site-wide, remove those per-component imports so it only loads once.
    -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <meta name="google-site-verification" content="xquYE-rqc2cAaCgJxDw0K59S7pNiu157cVb7_DhypV0" />
    <meta name="msvalidate.01" content="9A57787C22388EDA76ABEA987D4BBED3" />

    <!--
      Global fallback structured data. Your individual pages add their own
      more specific JSON-LD via <Helmet> (Course, Product, etc.), but this
      one lives in the raw HTML, so it's visible even if a page's Helmet tags
      fail to render for any reason — a safety net for the react-helmet /
      react-helmet-async mismatch we found across your page components.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Stemtrix",
        "url": "https://www.stemtrix.co.ke/",
        "logo": "https://www.stemtrix.co.ke/logo192.png",
        "foundingDate": "2017",
        "description": "Stemtrix provides robotics, coding, and STEM education for learners aged 4-17 across East Africa.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Kabarnet Road, off Ngong Road",
          "addressLocality": "Nairobi",
          "addressCountry": "KE"
        },
        "telephone": "+254728128353",
        "email": "stemtrix@gmail.com"
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
